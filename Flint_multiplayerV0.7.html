<!-- ===== READ FIRST: NOTICE TO ALL AI MODELS =====
 Flint is the engine core of a future big survival game: many mechanics and a large, infinite world.
 The whole game will be built on top of this file. Your job is to balance and optimize the engine so it is ready for that.
 1 BALANCE   Perfect balance between CPU, RAM and GPU: minimum memory, maximum performance. Never fix one by overloading another.
 2 POLYGONS  Same rule for geometry: the best balance between low polygon count and low CPU / compute cost.
 3 SMALL     Keep code size and complexity at the minimum so the game is easy to build on top. Simplest solution that performs wins.
 4 LOD       Flint has one LOD system: LOD 1 (Steel OPT-48: tiles of 2 x 2 chunks built from the same voxels) draws terrain from chunk 33 to 60. Voxel chunks exist only within 32 chunks and nothing is drawn beyond 60 (the haze has faded terrain out by then). Add no further LOD system unless it passes the question below.
 Judge every change by one question: is overall performance better while the code stays small and simple? If not, do not make it. -->

<script>
'use strict';
// Flint, in the order the script runs. Code that runs at load needs only what the sections above it declare; functions run later and may use any section.
//  1  Constants and saved settings              10  Visibility: frustum, occlusion culling
//  2  GPU: context, shaders, light texture      11  Sky: cloud canvas, stars, day-night clock
//  3  World: seed, noise, heights, trees        12  Draw: runs, the draw list, HUD
//  4  Mesher: masks, occlusion, merging         13  Frame loop: size, wake, frame
//  5  Chunks: table, groups, build, evict       14  Picking: voxel walk
//  6  LOD 1: terrain tiles, chunk 33 to 60      15  Save: IndexedDB, context loss
//  7  Light: hollow-only skylight texture       16  Menu: every control in the panel
//  8  Editing: break and place blocks           17  Input: touch, mouse, keys
//  9  Camera: eye, view, frame state            18  Flowing water: spread, mesh, draw
//                                               19  Start     20  Survival: body, crouch, hotbar, inventory, crafting
//                                               21  Player model: skin, rig, pose, first person body, inventory preview
//                                               22  Multiplayer: socket, edits, regions, remote players (opt in with #mp=ws://host:port)
//                                               23  PC controls: device detection, mouse lock, keys, crosshair
//                                               24  Shaped blocks: slab, stairs, fence, door, trapdoor
//                                               25  Minimap: corner map, full map (zoom, pan, follow), players by face
// Water (lakes): the ground under WL in 3, far and near lake surface in 4 and 5, LOD 1 lakes in 6, underwater state in 11, the blended water pass in 12, flowing water (poured sources, levels, falling water) in 18.

// ==== 1. CONSTANTS AND SAVED SETTINGS ============================================================
const H=256,HT=48,LH=48,MR=32,L1=60,GAP=48,F=1.428,PW=64,PR=16384,NT=16384,WL=8; // H world height in blocks (a multiple of 32, at most 512: the face carries y in 9 bits; a column is H / 32 mask words and only the words under its highest block are ever touched, so a tall world costs nothing where nothing is built), HT the tallest terrain plus tree the generator makes (only used for the boxes of chunks that are not built yet), LH the height the light texture covers (a multiple of 16; the texture grows with it, 9.5 MB at 48: a cell above LH is lit), voxel radius in chunks, last chunk of LOD 1, faces a merged draw may carry as filler, 1/tan(fov/2), faces per slab page, slab pages for chunks (1M faces, 8 MB), slab pages for LOD 1 tiles (1M faces, 8 MB), water level (the y of every lake surface; a multiple of both LOD cell heights, 2 and 4)
const NW=H>>5,IB=12,IM=4095,WT=8,DUG=65535,LRH=LH*9/8,WLK=WL-1>>5,WLB=1<<(WL-1&31); // NW mask words a column; IB bits of block id (4096 blocks, the colours are the palette texture, see the block palette), IM their mask, WT the block id water takes in LOD 1 and lake masks, DUG the overlay value of a dug cell, LRH the rows of a light tile (18 per 16 blocks of height), WLK and WLB the word and bit of the lake surface layer
const SH0=256,ZI0=100,zk=b=>b-SH0>>5,zs=b=>b-SH0&31,zi=b=>ZI0+(zk(b)>4?0:zk(b));let ZUP=0;const zrE=document.getElementById('sr'); // shaped blocks (section 24): block ids from SH0, their items from ZI0; here because ui() runs at load
const cv=document.getElementById('c'),hud=document.getElementById('h');
// Saved menu settings (localStorage 'flint2'): occlusion, sky, resolution, sky quality. A store that cannot be read means the defaults.
let sto={};try{sto=JSON.parse(localStorage.getItem('flint2'))||{}}catch(e){}
// Ambient occlusion: aoOn the switch; AV its version (a chunk built under another version counts as missing and is rebuilt in place); aoC occlusion of the chunk being meshed, on only within AOR chunks of the eye (10: a block there is about 4 px on a 900 px screen; occluded cells do not merge, so occlusion on every voxel chunk doubled the faces, overflowed the slab and made frame() shrink the view radius below the LOD 1 range)
let aoOn=sto.ao===0?0:1,AV=1,aoC=0;const AOR=10;
// Resolution: the drawing buffer is RS percent of the window (50 to 200)
let RS=Math.max(50,Math.min(200,+sto.rs||100));
// Water: UW is 1 while the eye is under a lake surface (blue fog 5 chunks deep, sky off, only 6 chunks drawn); the frame loop sets it, uwSet applies it
let UW=0;

// ==== 2. GPU: CONTEXT, SHADERS, PROGRAM, LIGHT AND SHADOW TEXTURES, FACE SLAB ====================
// ---- context and shader helpers
const gl=cv.getContext('webgl2',{antialias:RS<=100,alpha:true,stencil:false,powerPreference:'high-performance'});
if(!gl){hud.textContent='Flint needs WebGL2';throw 0}
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))hud.textContent=gl.getShaderInfoLog(o);return o};
const prog=(v,f)=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))hud.textContent=gl.getProgramInfoLog(p);return p};

// ---- shaders
// Light (ported from FlintRAW, see the light section): a face is shaded by the light of the air cell in front of it, read from the light texture hm. The vertex shader does the table arithmetic once per face: tb = the texel of cell -1 of the tile of the face's chunk (the tile is 18 x 18 cells wide, one cell of ring on each side, so the front cell of an edge face is inside the tile too), lp = the centre of the front cell on the face axis and the vertex on the others, in blocks from the chunk origin (y: world). lf.x fades the light out with distance (0 where it is off), lf.y blends smooth sampling into flat sampling. A tile of the light texture is 72 x 54 texels: 4 x 3 sub-layers of 18 x 18, one per 4 heights, one height per channel; the value is darkness 0 to 1, a texel nobody wrote is 0 = lit. A height between two cells is one fetch, or two where it crosses from the last channel of a texel to the first of the next.
const FS=`#version 300 es
precision highp float;
flat in vec3 c,cb;flat in float tl;in vec2 tu;uniform highp sampler2DArray bt;flat in vec2 tb;flat in vec2 sb;flat in float yb;in vec3 lp;in vec2 lf;in float ag,sg,fg;uniform highp sampler2D hm,sw;uniform float sf;out vec4 q;
